{% if page.url != "/" and page.url != "/index.html" %}
<style>
  /* Burgermenü oben rechts auf Unterseiten ausblenden */
  #site-nav-toggle, 
  .site-header-toggle, 
  .nav-trigger {
    display: none !important;
  }

  /* Geschwungenen Zurück-Pfeil oben rechts platzieren */
  .back-arrow-header {
    position: absolute;
    top: 12px;
    right: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    color: #4a4542; /* Dezent dunkler Schieferton */
    text-decoration: none;
    border-radius: 50%;
    transition: all 0.2s ease;
    z-index: 1000;
  }

  .back-arrow-header:hover {
    color: #111111;
    background-color: rgba(0, 0, 0, 0.06);
  }

  .back-arrow-header svg {
    width: 22px;
    height: 22px;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    var header = document.querySelector('.site-header');
    if (header && !document.querySelector('.back-arrow-header')) {
      var backLink = document.createElement('a');
      backLink.href = "{{ '/' | relative_url }}";
      backLink.className = 'back-arrow-header';
      backLink.title = 'Zurück zur Hauptübersicht';
      backLink.setAttribute('aria-label', 'Zurück zur Hauptübersicht');
      backLink.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
        </svg>
      `;
      header.appendChild(backLink);
    }
  });
</script>
{% endif %}
