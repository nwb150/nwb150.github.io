<!-- Leaflet CSS & JS nur einmalig laden -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<!-- Karten-Container -->
<div id="leaflet-map" style="width: 100%; height: 320px; border-radius: 8px; margin-top: 15px; background: #e5e3df; z-index: 1;"></div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  var mapContainer = document.getElementById('leaflet-map');
  if (!mapContainer) return;

  {% if page.lat and page.lng %}
    // -----------------------------------------------------------
    // MODUS 1: Ort/Koordinaten vorhanden (z. B. Neuwittenbek)
    // -----------------------------------------------------------
    var lat = {{ page.lat }};
    var lng = {{ page.lng }};
    var zoom = {{ page.zoom | default: 12 }};

    var map = L.map('leaflet-map').setView([lat, lng], zoom);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // Marker mit Pop-up setzen
    var marker = L.marker([lat, lng]).addTo(map);
    {% if page.title %}
      marker.bindPopup("<b>{{ page.title | escape }}</b>").openPopup();
    {% endif %}

  {% elsif page.country == "RUS" or page.country == "Russland" or page.location == "Russland" %}
    // -----------------------------------------------------------
    // MODUS 2: Landesansicht (z. B. Russland)
    // -----------------------------------------------------------
    var map = L.map('leaflet-map').setView([60, 90], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // GeoJSON für Russland laden und dezent einfärben
    fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries/RUS.geo.json')
      .then(function(response) { return response.json(); })
      .then(function(data) {
        L.geoJSON(data, {
          style: {
            color: '#8b5cf6',       // Rahmenfarbe (Lila)
            weight: 1.5,
            fillColor: '#8b5cf6',   // Füllfarbe
            fillOpacity: 0.20       // Transparenz
          }
        }).addTo(map);
      })
      .catch(function(err) {
        console.error("Fehler beim Laden der GeoJSON-Landesgrenze:", err);
      });

  {% else %}
    // -----------------------------------------------------------
    // MODUS 3: Fallback (Weltkarte)
    // -----------------------------------------------------------
    var map = L.map('leaflet-map').setView([50, 30], 3);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);
  {% endif %}
});
</script>
