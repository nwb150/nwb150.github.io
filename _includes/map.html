<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<div id="leaflet-map" 
     style="width: 100%; height: 320px; border-radius: 8px; margin-top: 15px; background: #e5e3df; z-index: 1;"
     data-lat="{{ page.lat }}"
     data-lng="{{ page.lng }}"
     data-zoom="{{ page.zoom | default: 12 }}"
     data-location="{{ page.location }}"
     data-country="{{ page.country }}"
     data-title="{{ page.title | escape }}">
</div>

<script src="{{ '/assets/js/map.js' | relative_url }}"></script>
