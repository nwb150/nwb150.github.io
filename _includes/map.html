{% assign query = page.location | default: page.title %}
{% if query %}
<div style="width: 100%; height: 320px; border-radius: 8px; overflow: hidden; margin-top: 15px; border: 1px solid #ccc;">
  <iframe 
    width="100%" 
    height="320" 
    style="border:0;" 
    loading="lazy" 
    allowfullscreen 
    src="https://maps.google.com/maps?q={{ query | url_encode }}&t=&z={{ page.zoom | default: 4 }}&ie=UTF8&iwloc=&output=embed">
  </iframe>
</div>
{% endif %}
